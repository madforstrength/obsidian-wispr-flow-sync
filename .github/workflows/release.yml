name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write # create the release and upload its assets
  id-token: write # mint the OIDC token for a Sigstore signing certificate
  attestations: write # persist the attestation
  artifact-metadata: write # create the artifact storage record

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run inline-wasm
      - run: npx tsc --noEmit
      # Generated, gitignored fixture the db/repository/engine tests open.
      - run: npm run fixture
      - run: npx vitest run
      - run: node esbuild.config.mjs production

      - name: Tag must equal manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag '$TAG' does not equal manifest.json version '$MANIFEST'. Obsidian matches these literally — no 'v' prefix."
            exit 1
          fi

      # Attests the exact main.js that ships below, so anyone can verify it was
      # built by this workflow from this repo:
      #   gh attestation verify main.js --repo madforstrength/obsidian-wispr-flow-sync
      # Runs after the tag guard so a mismatched tag never produces one, and
      # before the upload so an unattested asset is never published.
      - name: Attest build provenance for main.js
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: main.js

      - name: Create release with the two required assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "See CHANGELOG or commit history." \
            main.js manifest.json
