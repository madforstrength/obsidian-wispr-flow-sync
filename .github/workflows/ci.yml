name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # wasmBinary.ts is generated and gitignored — without this the
      # typecheck, tests and build all fail on a clean checkout.
      - run: npm run inline-wasm
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: node esbuild.config.mjs production
