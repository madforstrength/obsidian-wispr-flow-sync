name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # wasmBinary.ts is generated and gitignored — without this the
      # typecheck, tests and build all fail on a clean checkout.
      - run: npm run inline-wasm
      - run: npx tsc --noEmit
      # The SQLite fixture is generated and gitignored too (8 MB, mostly
      # padding). db/repository/engine tests open it, so it must exist before
      # vitest runs. Needs the sqlite3 CLI, which ubuntu-latest ships.
      - run: npm run fixture
      - run: npx vitest run
      - run: node esbuild.config.mjs production
